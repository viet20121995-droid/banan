name: banan_internal
description: Banan internal ops app — QC, Mystery Shopper, Training, weekly schedule. ADMIN-only.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  banan_core:
    path: ../../packages/core
  banan_design_system:
    path: ../../packages/design_system
  banan_domain:
    path: ../../packages/domain
  banan_data:
    path: ../../packages/data
  banan_features_shared:
    path: ../../packages/features_shared

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.20.0
  file_picker: ^8.0.6
  dio: ^5.4.3+1
  # QR render for the public MS link generator (pure-Dart painter, no
  # platform channels — safe on web).
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
